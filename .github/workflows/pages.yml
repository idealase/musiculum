name: Deploy Musiculum to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Inject Spotify Client ID config
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          client_id = os.environ.get("SPOTIFY_CLIENT_ID", "").strip()
          Path("genres/spotify-client.js").write_text(
              f"window.__MUSICULUM_SPOTIFY_CLIENT_ID__ = {json.dumps(client_id)};\n",
              encoding="utf-8",
          )
          if not client_id:
              print("::warning::SPOTIFY_CLIENT_ID is empty; playlist export will stay unconfigured.")
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
